[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observatory-research"
version = "0.1.0"
description = "Observatory: coding-agent usage, task evidence and reproducible collaboration research"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pandas==3.1.0",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "requests==2.34.2",
]

[project.optional-dependencies]
experience = ["jsonschema==4.26.0", "attrs==26.1.0", "jsonschema-specifications==2025.9.1", "referencing==0.37.0", "rpds-py==2026.9.1", "PyYAML==6.0.3", "typing-extensions==4.16.0"]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
